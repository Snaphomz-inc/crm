# Snaphomz CRM stack: Odoo 19 Community + PostgreSQL + n8n (+ Caddy in production).
#
# Odoo and n8n each get their own PostgreSQL server, database user and
# persistent volume. Images are pinned; never switch to floating tags.
# Application ports bind to 127.0.0.1 only. In production the `proxy`
# profile adds Caddy, which terminates HTTPS for one hostname and exposes only:
#   https://${CRM_HOSTNAME}/webhook/* -> n8n production webhooks
#   https://${CRM_HOSTNAME}/...       -> Odoo (web + websocket)
# The n8n editor stays private (SSH tunnel to 127.0.0.1:5678).

name: snaphomz-crm

services:
  odoo-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0-20261015
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD}
      TZ: UTC
    command: ["odoo", "--config=/etc/odoo/odoo.conf"]
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
      - odoo-filestore:/var/lib/odoo

  n8n-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.43.8
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${CRM_HOSTNAME:-localhost}
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${CRM_HOSTNAME:-localhost}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Odoo is reached on the internal network, never through the proxy.
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB_NAME:-snaphomz}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

  caddy:
    image: caddy:2.11.7
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [odoo, n8n]
    environment:
      CRM_HOSTNAME: ${CRM_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  odoo-db-data:
  odoo-filestore:
  n8n-db-data:
  n8n-data:
  caddy-data:
  caddy-config:
