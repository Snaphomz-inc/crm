[options]
; Connection details (host/user/password) come from the container environment.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; One production database; the web database manager is disabled.
db_name = snaphomz
dbfilter = ^snaphomz$
list_db = False

; Behind Caddy: trust X-Forwarded-* headers.
proxy_mode = True

; Sized for ~4 vCPU / 8 GB. Revisit after observing real usage.
workers = 4
max_cron_threads = 1
gevent_port = 8072
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
limit_time_cpu = 120
limit_time_real = 240

; Cron jobs and outgoing mail run on UTC; users see their own timezone.
log_level = info
